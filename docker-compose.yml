# Optional: a ready-made PostgreSQL for local development.  Run: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rrms
      POSTGRES_PASSWORD: rrms
      POSTGRES_DB: rrms
    ports:
      - "5432:5432"
    volumes:
      - rrms_data:/var/lib/postgresql/data
volumes:
  rrms_data:
